name: Build BillCraft APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Validate Gradle
        uses: gradle/wrapper-validation-action@v2

      - name: Generate dummy google-services.json
        run: |
          cat << EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.aistudio.billcraft.app"
                  }
                },
                "api_key": [
                  {
                    "current_key": "dummy-api-key"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Create local.properties for Keystore configuration
        run: |
          cat << EOF > local.properties
          RELEASE_STORE_FILE=dummy-keystore.jks
          RELEASE_STORE_PASSWORD=dummy
          RELEASE_KEY_ALIAS=dummy
          RELEASE_KEY_PASSWORD=dummy
          EOF
          keytool -genkey -v -keystore dummy-keystore.jks -storepass dummy -alias dummy -keypass dummy -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Dummy,O=Dummy,C=US"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BillCraft-Debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BillCraft-Release
          path: app/build/outputs/apk/release/*.apk
